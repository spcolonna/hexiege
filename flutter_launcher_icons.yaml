# Los PNG de origen viven en store/icon/ (fuera del bundle, no se commitean):
# app_icon.png (1024, opaco) y app_icon_fg.png (72% centrado, transparente).
flutter_launcher_icons:
  image_path: "store/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1E1712"
  adaptive_icon_foreground: "store/icon/app_icon_fg.png"
